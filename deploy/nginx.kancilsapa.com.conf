# nginx untuk kancilsapa.com (situs statis hasil `pnpm build`, folder build/).
# Letakkan di /etc/nginx/conf.d/kancilsapa.com.conf lalu `nginx -t && systemctl reload nginx`.
#
# Cloudflare: DNS A/AAAA kancilsapa.com dan www -> IP VPS, status "Proxied".
# SSL/TLS mode "Full (strict)" dengan sertifikat Cloudflare Origin CA di VPS (atau certbot).

# www -> apex
server {
	listen 80;
	listen [::]:80;
	server_name kancilsapa.com www.kancilsapa.com;
	return 301 https://kancilsapa.com$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name www.kancilsapa.com;

	ssl_certificate     /etc/ssl/cloudflare/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/origin.key;
	return 301 https://kancilsapa.com$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name kancilsapa.com;

	ssl_certificate     /etc/ssl/cloudflare/origin.pem;
	ssl_certificate_key /etc/ssl/cloudflare/origin.key;

	root /var/www/kancilsapa.com/current;
	index index.html;

	# Berkas .br dan .gz dibuat saat build (adapter-static precompress).
	gzip_static on;
	# brotli_static on;   # aktifkan bila modul ngx_brotli terpasang

	charset utf-8;

	# URL tanpa ekstensi: /faq -> /faq.html
	location / {
		try_files $uri $uri.html $uri/index.html =404;
	}

	error_page 404 /404.html;
	location = /404.html { internal; }

	# Aset ber-hash: cache selamanya.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		include /etc/nginx/snippets/kancilsapa-security-headers.conf;
	}

	# Skrip chat bot: nama tetap, versi lewat ?v=<hash isi> di HTML, jadi aman di-cache lama.
	location /chatbot/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		include /etc/nginx/snippets/kancilsapa-security-headers.conf;
	}

	# Ikon dan OG: cache sedang.
	location ~* \.(png|ico|webmanifest)$ {
		add_header Cache-Control "public, max-age=86400";
		include /etc/nginx/snippets/kancilsapa-security-headers.conf;
	}

	# HTML dan sitemap: selalu validasi ulang.
	location ~* \.(html|xml|txt)$ {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		include /etc/nginx/snippets/kancilsapa-security-headers.conf;
	}

	include /etc/nginx/snippets/kancilsapa-security-headers.conf;
}
