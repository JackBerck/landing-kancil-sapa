<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'RCB';
				src: url('../node_modules/@fontsource-variable/radio-canada-big/files/radio-canada-big-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 400 700;
			}
			@font-face {
				font-family: 'RC';
				src: url('../node_modules/@fontsource-variable/radio-canada/files/radio-canada-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 300 700;
			}
			:root {
				--paper: oklch(97.5% 0.005 90);
				--ink: oklch(19% 0.022 266);
				--field: oklch(44% 0.2 266);
				--field-ink: oklch(97.5% 0.005 90);
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: linear-gradient(to right, var(--paper) 50%, var(--field) 50%);
				font-family: 'RC', sans-serif;
				position: relative;
			}
			.layer {
				position: absolute;
				inset: 0;
				padding: 56px 64px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.over h1 {
				clip-path: inset(0 0 0 50%);
			}
			.base h1 {
				clip-path: inset(0 50% 0 0);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 16px;
				font:
					700 26px/0.95 'RCB',
					sans-serif;
				color: var(--ink);
			}
			.brand img {
				width: 64px;
				height: 64px;
			}
			.brand span span {
				display: block;
			}
			.brand span span + span {
				font-weight: 400;
			}
			h1 {
				font:
					700 104px/0.92 'RCB',
					sans-serif;
				letter-spacing: -0.045em;
				color: var(--ink);
				margin-inline: -64px;
				padding-inline: 64px;
			}
			.over h1 {
				color: var(--field-ink);
			}
			.foot {
				display: flex;
				justify-content: space-between;
				align-items: flex-end;
				font-size: 26px;
				color: var(--ink);
			}
			.big {
				font:
					700 150px/0.85 'RCB',
					sans-serif;
				letter-spacing: -0.05em;
				color: var(--field-ink);
			}
			.over .brand,
			.over .foot > div:first-child {
				visibility: hidden;
			}
			.base .big {
				color: var(--field-ink);
			}
		</style>
	</head>
	<body>
		<div class="layer base">
			<div class="brand">
				<img src="../src/lib/assets/brand/logo-imigrasi.png" alt="" />
				<span><span>KANCIL</span><span>SAPA</span></span>
			</div>
			<h1>Layanan imigrasi Cilacap, lewat WhatsApp</h1>
			<div class="foot">
				<div>Kantor Imigrasi Kelas I TPI Cilacap</div>
				<div class="big">24/7</div>
			</div>
		</div>
		<div class="layer over">
			<div class="brand"><span></span></div>
			<h1>Layanan imigrasi Cilacap, lewat WhatsApp</h1>
			<div class="foot"><div></div></div>
		</div>
	</body>
</html>
